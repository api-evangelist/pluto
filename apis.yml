name: Pluto
description: 'Pluto (Pluto Health, trypluto.com now pluto.health) is an AI-powered clinical
  intelligence and care-delivery platform that unifies fragmented health data from roughly
  90% of US health systems. It aggregates medical records, insurance data, and social
  determinants of health, then applies AI-driven clinical intelligence to surface care
  gaps, coordinate preventive care, screenings, vaccines and at-home lab testing, and match
  patients to clinical trials. Pluto offers turnkey, white-label, or API-based deployment
  of its clinical operations. It is backed by Sierra Ventures. As of this enrichment pass the
  company publishes no public developer portal, API reference, SDKs, or documentation.'
